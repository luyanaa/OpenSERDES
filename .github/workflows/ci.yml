name: ci

on:
  push:
  pull_request:

jobs:
  rtl-and-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys ngspice python3-pip

      - name: Install sv2v (pinned, used for the Yosys/LibreLane path)
        run: |
          curl -sL --fail --max-time 120 \
            https://github.com/zachjs/sv2v/releases/download/v0.0.12/sv2v-Linux.zip \
            -o /tmp/sv2v.zip
          unzip -q /tmp/sv2v.zip -d /tmp/sv2v
          sudo install -m755 /tmp/sv2v/sv2v-Linux/sv2v /usr/local/bin/sv2v
          sv2v --version

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r verification/requirements.txt

      - name: RTL simulation (self-checking testbenches)
        run: make sim PYTHON=python3

      - name: Verilator lint
        run: make lint

      - name: Yosys generic synthesis
        run: make synth

      - name: Regression matrix and generator packages
        run: make regress PYTHON=python3

      - name: SI/BER framework tests (includes RTL CDR/RX JTOL)
        run: python3 -m unittest discover -s verification/tests -v

      - name: Generate CI package for the bound capability gate
        run: make gen SPEC=spec/soc.yaml OUT=out/ci-soc PYTHON=python3

      - name: Link capability gate (bound to generated package)
        run: make verify-link PYTHON=python3 VERIFY_PACKAGE=out/ci-soc \
          VERIFY_PROFILE=verification/profiles/clean.yaml \
          VERIFY_JTOL_MIN_AMP_UI=0.05

      - name: Analog macro contracts
        run: make analog-contracts PYTHON=python3

      - name: Generated-top SoC E2E smoke
        run: make soc-e2e PYTHON=python3 SOC_E2E_PACKAGE=out/ci-soc

      - name: Source-synchronous SoC E2E stress
        run: make soc-e2e-stress PYTHON=python3 SOC_E2E_PACKAGE=out/ci-soc

      - name: Analog LUT smoke test (generic demo; no PDK claim)
        run: make analog-lut-demo PYTHON=python3

      - name: Upload gate report
        uses: actions/upload-artifact@v4
        with:
          name: link-verification
          path: |
            build/verify/ber.json
            build/verify/soc_e2e.json
            build/verify/soc_e2e_stress.json
