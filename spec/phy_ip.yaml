# 50 Mb/s x OVERSAMPLE 8 = 400 MHz RX, the measured icsprout55 sample-clock
# limit.  The earlier 100 Mb/s / 800 MHz config was rejected by the
# max_sample_clock_mhz gate introduced in item 2; it was not a closable spec.
name: phy_ip_32x8_50m
target: link

link:
  payload_width: 32
  words: 8
  line_rate_mbps: 50
  coding: raw
  bit_order: lsb_first

tx:
  architecture: word_group_capture
  capture: word_group

rx:
  architecture: adaptive_oversampling
  oversample: 8
  align: comma_per_frame
  clocking: independent
  ppm: 100
  sync_pattern: 0xBC
  sync_len: 32

tech:
  tx:
    name: icsprout55
    scl: ics55_LLSC_H7CL
  rx:
    name: icsprout55
    scl: ics55_LLSC_H7CL

interface:
  preset: phy_ip
  enable_mode: dynamic
  user_clock_mhz: 50

constraints:
  uncertainty_setup_ns: 0.050
  uncertainty_hold_ns: 0.020

optimization:
  objectives: [area, power, latency]
