name: rx_axis_8x4_25m
target: rx

link:
  payload_width: 8
  words: 4
  line_rate_mbps: 25
  coding: raw
  bit_order: lsb_first

tx:
  architecture: parallel_mux
  capture: parallel

rx:
  architecture: fixed_oversampling
  oversample: 4
  align: comma_per_frame
  clocking: independent
  ppm: 0
  sync_pattern: 0xBC
  sync_len: 8

tech:
  tx: sky130
  rx: sky130

interface:
  preset: default
  data: axi4_stream
  control: native
  cdc: none
  enable_mode: static
  user_clock_mhz: 25

constraints:
  uncertainty_setup_ns: 0.100
  uncertainty_hold_ns: 0.050

optimization:
  objectives: [area, power]
