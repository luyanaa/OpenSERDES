# Half-rate TX endpoint (item 7). target: tx only; there is no verified
# half-rate RX. clk_bit runs at the line rate; clk_word = clk_bit / 2.
name: tx_half_rate_8x4
target: tx
link:
  payload_width: 8
  words: 4
  line_rate_mbps: 50
  coding: raw
  bit_order: lsb_first
tx:
  architecture: word_streaming
  rate_mode: half
rx:
  architecture: fixed_oversampling
  oversample: 4
  align: external
  clocking: independent
  ppm: 0
tech:
  tx: sky130
  rx: sky130
interface:
  preset: minimal
  data: valid_ready
  control: native
  cdc: none
  enable_mode: static
constraints:
  uncertainty_setup_ns: 0.100
  uncertainty_hold_ns: 0.050
