# 4x BBPD + 2nd-order loop + fractional NCO (CDR_MODE=3).
# Verified 0/+-700/+-1000 ppm by tb_cdr_bang_bang (5000 and 20000 bits, and
# 100k bits at 6% transition density; PRBS / long-run / bursty / low density),
# phase_offset 0..3 by tb_cdr_phase_offset, the leak period by tb_cdr_leak,
# and the emitted endpoint by tb_rx_endpoint_cdr at 0/+-700 ppm.
name: bang_bang_4x_8x4
target: rx
link:
  payload_width: 8
  words: 4
  line_rate_mbps: 25
  coding: raw
  bit_order: lsb_first
tx:
  architecture: parallel_mux
rx:
  architecture: bang_bang_oversampling
  oversample: 4
  align: external
  clocking: independent
  ppm: 700
  sync_len: 8
tech:
  tx: sky130
  rx: sky130
interface:
  preset: minimal
  data: valid_ready
  control: native
  cdc: none
  enable_mode: static
constraints:
  uncertainty_setup_ns: 0.100
  uncertainty_hold_ns: 0.050
