# Half-rate RX endpoint. clk_bit is the source-synchronous bit clock and
# clk_word = clk_bit / 2 drives the wide parallel bank.  The RX pair front end
# and the half-rate deserializer are integrated by gen_ip.py.
name: rx_half_rate_8x4
target: rx
link:
  payload_width: 8
  words: 4
  line_rate_mbps: 50
  coding: raw
  bit_order: lsb_first
tx:
  architecture: word_streaming
rx:
  architecture: source_sync
  rate_mode: half
  oversample: 1
  align: comma_per_frame
  clocking: source_sync
  ppm: 0
  sync_len: 8
  sync_pattern: 188
tech:
  tx: sky130
  rx: sky130
interface:
  preset: minimal
  data: valid_ready
  control: native
  cdc: none
  enable_mode: static
constraints:
  uncertainty_setup_ns: 0.100
  uncertainty_hold_ns: 0.050
