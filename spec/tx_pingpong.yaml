# Ping-pong register-bank TX (item 10).  ready stays high on back-to-back
# frames instead of dropping for WORDS capture cycles; costs one extra bank.
name: tx_pingpong_8x4
target: tx
link:
  payload_width: 8
  words: 4
  line_rate_mbps: 50
  coding: raw
  bit_order: lsb_first
tx:
  architecture: parallel_mux
  bank: pingpong
rx:
  architecture: fixed_oversampling
  oversample: 4
  align: external
  clocking: independent
  ppm: 0
tech:
  tx: sky130
  rx: sky130
interface:
  preset: minimal
  data: valid_ready
  control: native
  cdc: none
  enable_mode: static
constraints:
  uncertainty_setup_ns: 0.100
  uncertainty_hold_ns: 0.050
