name: ihp_sg13g2
status: device_and_macro_verified
pdk: ihp-sg13g2
vdd_v: 1.2
default_corner: tt
devices:
  style: subckt
  nmos: sg13_lv_nmos
  pmos: sg13_lv_pmos
  ports: d g s b
  finger_param: ng
  body:
    nmos: substrate
    pmos: nwell
  note: >
    NMOS body is the PDK global substrate node (extracted as "sub"). PMOS body
    is the n-well; the bare SG13_dev pmos PCell leaves it as an internal node,
    so a PDK n-well guard ring (guardRingType=nwell) plus a contacted Metal1
    tie is used to expose the "b" port.
analog_lut_status: scaffold
analog_lut_note: >-
  Device-level DRC/LVS/PEX/model closure is verified, but the generic
  extract_lut flow has not been adapted to IHP's OSDI/PSP103 model loading and
  is not validated for this PDK. Do not treat `make analog-lut ANALOG_TECH=ihp_sg13g2`
  as verified.

sizing_um:
  wn: 0.15
  wp: 0.3
  l: 0.13
model:
  mode: osdi_psp103
  lib_rel: libs.tech/ngspice/models/cornerMOSlv.lib
  section: mos_tt
  includes:
  - libs.tech/ngspice/osdi/psp103.osdi
  - libs.tech/ngspice/osdi/psp103_nqs.osdi
  - libs.tech/ngspice/osdi/r3_cmc.osdi
  - libs.tech/ngspice/osdi/mosvar.osdi
  osdi_install_rel: libs.tech/ngspice/install.py
  osdi_install_tool: OpenVAF 23.5.0 (/opt/openvaf)
  note: >
    OSDI models are compiled by the PDK install.py and loaded through
    ~/.spiceinit. Two optional MOM-cap OSDI libraries (cap_cmomi/cap_cmomf)
    are absent; ngspice warns at start-up but the PSP103 MOS DC operating
    point models the devices.
pex:
  status: verified
  magic:
    tech: sg13g2
    rcfile_rel: libs.tech/magic/ihp-sg13g2.magicrc
    tech_file_rel: libs.tech/magic/ihp-sg13g2-extract.tech
    method: extract; extresist all; ext2spice extresist on; rthresh=0; cthresh=0
    resist_rules: present
  netgen:
    setup_rel: libs.tech/netgen/ihp-sg13g2_setup.tcl
  klayout:
    tech_rel: libs.tech/klayout/tech/sg13g2.lyt
    lyp_rel: libs.tech/klayout/tech/sg13g2.lyp
  evidence: build/verify/ihp_device/ihp_device_verify.json
  note: >
    Device extraction and PEX command closure, not full parasitic signoff.
    NMOS PEX emits 6 capacitors and 0 resistors; PMOS PEX emits 2 resistors
    and 11 capacitors (one zero-valued floating cap). Counts are reported
    exactly as emitted.
pcell:
  backend: cni_pycell
  library: SG13_dev
  device: nmos/pmos
  parameters: "l/w/ng (unit strings, e.g. 0.13u/1u/1)"
  technology_name: sg13g2
  status: geometry_verified
verification:
  script: verification/analog/ihp_device_verify.py
  doc: docs/ihp_device_closure.md
  evidence_dir: build/verify/ihp_device
  results:
    drc_errors:
      nmos: 0
      pmos: 0
    lvs:
      nmos: match
      pmos: match
    pex:
      nmos: {resistors: 0, capacitors: 6}
      pmos: {resistors: 2, capacitors: 11}
    model_dc:
      nmos: pass
      pmos: pass
macro:
  rx_fb_pcell:
    status: verified
    reference: sky130 rx_fb_pcell electrical topology
    ports: [VSS, VDD, IN, OUT]
    nets: [VSS, VDD, IN, OUT, net06]
    topology: >-
      3 CMOS inverters + 3 extra parallel PMOS + 2 series feedback PMOS
      (OUT -> fb1 S=G=OUT/D=net06 -> fb0 S=G=net06/D=IN).  NMOS bodies VSS,
      PMOS bodies VDD.
    hierarchy:
      rx_inv: 3
      rx_pmos_extra: 3
      rx_pmos_fb: 2
    sizes_um:
      inverter_nmos: {w: 5.0, l: 0.13}
      inverter_pmos: {w: 5.0, l: 0.13}
      extra_pmos: {w: 5.0, l: 0.13}
      feedback_pmos: {w: 0.55, l: 2.0}
    drc_errors: 0
    lvs:
      result: unique_match
      top_instances: 8
      top_nets: 5
      body_ports_present: true
    pex:
      method: extract; extresist all; ext2spice extresist on; rthresh=0; cthresh=0
      device_instances: 11
      device_classes: {sg13_lv_nmos: 3, sg13_lv_pmos: 8}
      observed_runs:
      - {resistors: 55, capacitors: 26, floating_caps: 16}
      - {resistors: 14, capacitors: 17, floating_caps: 7}
      - {resistors: 14, capacitors: 17, floating_caps: 7}
      - {resistors: 14, capacitors: 17, floating_caps: 7}
      - {resistors: 25, capacitors: 24, floating_caps: 14}
      repeatability:
        script: verification/analog/ihp_pex_repeatability.py
        evidence: build/verify/ihp_pex_repeatability/repeatability.json
        runs: 5
        structural_stable: false
        electrical_stable_at_5pct: true
        classification: electrically-equivalent-with-different-rc-segmentation
        relative_spread:
          op_out_v: 0.0
          ac_mid_db: 1.4e-12
          ac_high_db: 1.55e-8
          input_cap_1m_f: 2.32e-9
          zin_ohm: 1.09e-5
          zout_ohm: 0.0
          transient_final: 0.0
          noise_total: 3.03e-3
        note: >-
          Same GDS and deck, five isolated Magic extract/extresist runs.
          R/C counts and floating-cap counts vary, but DC/AC/transient/noise
          port responses agree within the 5% diagnostic gate. This is an
          electrical-equivalence result, not deterministic segmentation.
    note: >-
      Magic extresist node ordering is not stable across invocations; the
      same GDS produced different R/C counts.  The five-run audit classifies
      the variation as different RC segmentation with equivalent port
      responses.  This is command closure, not deterministic full-parasitic
      signoff.
    negative_control:
      method: removed VDD body tie strap on rx_pmos_extra
      lvs_match: false
      rejected: true
    model_dc:
      status: pass
      v_out_v: 0.620552
      i_vdd_a: -3.90074e-4
      i_vin_a: 2.32e-11
      note: OSDI PSP103; missing optional cap OSDI libs warn but do not block.
    builder: verification/analog/ihp_rx_macro.py
    doc: docs/ihp_rx_macro_closure.md
    evidence: build/verify/ihp_rx_macro/ihp_rx_macro.json

capabilities:
  schematic: true
  macro_generation: false
  pcell_layout: verified
  drc: verified
  lvs: verified
  pex: verified_but_structurally_non_deterministic
  post_pex_analog: verified_repeatability
  macro_package: false
