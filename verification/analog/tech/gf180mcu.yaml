name: gf180mcu
status: device_verified
pdk: gf180mcuD
vdd_v: 3.3
default_corner: typical
devices:
  style: subckt
  nmos: nfet_03v3
  pmos: pfet_03v3
sizing_um:
  wn: 1.0
  wp: 1.0
  l: 0.28
model:
  mode: subckt
  root_search:
  - ${GF180_ROOT}
  - ${GF_ROOT}
  - ~/.ciel/ciel/gf180mcu/versions/*
  includes:
  - gf180mcuD/libs.tech/ngspice/design.ngspice
  - gf180mcuD/libs.tech/ngspice/sm141064.spice
  corner_library: typical
  subckts:
    nmos: nfet_03v3
    pmos: pfet_03v3
  port_order: d g s b
  note: >-
    ngspice binding is `.include design.ngspice` followed by
    `.lib sm141064.spice typical`.  The generic schematic-LUT extractor still
    expects a single sky130-style include and is not validated for this PDK;
    see analog_lut_status.
analog_lut_status: scaffold
analog_lut_note: >-
  Device-level DRC/LVS/PEX/model closure is verified, but the generic
  extract_lut schematic flow has not been adapted to gf180mcuD's .lib corner
  syntax.  Do not treat `make analog-lut ANALOG_TECH=gf180mcu` as verified.
pex:
  status: verified
  magic:
    tech: gf180mcuD
    rcfile_rel: gf180mcuD/libs.tech/magic/gf180mcuD.magicrc
    tech_file_rel: gf180mcuD/libs.tech/magic/gf180mcuD.tech
    pdk_root_rel: .
    extractor: magic
    extraction: "extract; extresist all; ext2spice cthresh 0; ext2spice extresist on"
  klayout:
    tech_rel: gf180mcuD/libs.tech/klayout/tech/gf180mcu.lyt
    lyp_rel: gf180mcuD/libs.tech/klayout/tech/gf180mcu.lyp
    lvs_rel: gf180mcuD/libs.tech/klayout/tech/lvs/gf180mcu.lvs
  netgen:
    setup_rel: gf180mcuD/libs.tech/netgen/gf180mcuD_setup.tcl
  verified_counts:
    nfet_03v3:
      R: 0
      C: 6
      X: 1
    pfet_03v3:
      R: 0
      C: 10
      X: 1
  evidence: build/verify/gf180_device/gf180_device_evidence.json
  note: >-
    Verified for one bulk-tied 3.3 V nfet_03v3 and pfet_03v3 at
    W=1.0 um / L=0.28 um / nf=1 using the PDK KLayout-API PCell plus
    probe-only gate contact/pad and MET1 labels.  Magic DRC is 0 errors,
    KLayout and netgen LVS match, and the Magic PEX netlist contains one
    device plus C elements (R=0 for this single-level-metal device).  This is
    not a foundry signoff and does not cover arbitrary W/L, guard rings,
    multi-finger arrays or full cells.
pcell:
  backend: klayout_api
  library: gf180mcu_klayoutapi
  device: nfet/pfet
  status: lvs_pex_verified
  params:
    volt: 3.3V
    bulk: Bulk Tie
    w_um: 1.0
    l_um: 0.28
    ld_um: 0.44
    nf: 1
    grw_um: 0.36
  probe_geometry: >-
    The PCell has no gate contact or labels.  Closure adds a 220 nm contact on
    Poly2 above the active region, a local Poly2/Metal1 gate pad, and MET1
    text labels (34/10) for S/D/B/G.  These are probe-only additions.
macros:
  rx_fb_pcell:
    status: verified
    cell: gf180_rx_macro
    topology: >-
      3 CMOS inverters (3 nfet_03v3 + 3 pfet_03v3), 3 extra parallel
      pfet_03v3, and 2 series feedback pfet_03v3 from OUT to IN via net06.
      8 block instances / 11 MOS device instances / 5 nets.
    ports: [VSS, VDD, OUT, IN]
    sizes:
      inverter_n: nfet_03v3 W=5u L=0.28u
      inverter_p: pfet_03v3 W=5u L=0.28u
      extra_p: pfet_03v3 W=5u L=0.28u
      feedback: pfet_03v3 W=0.55u L=8u
    drc_errors: 0
    lvs:
      klayout: match
      netgen: match
      netgen_hierarchical: match
      device_instances: 11
      nets: 5
    pex:
      devices: 11
      device_types:
        nfet_03v3: 3
        pfet_03v3: 8
      R: 0
      C: 10
      X: 11
      body_nets: [VSS, VDD]
      note: >-
        Magic extract/extresist with cthresh 0.  R=0 is real for this
        single-M1-rail macro; this is not full RC parasitic signoff.
    negative_control: >-
      Removing the first PMOS bulk-to-VDD strap makes its body float and
      KLayout LVS fails.
    evidence: build/verify/gf180_rx_macro/gf180_rx_macro_evidence.json
    note: >-
      Macro-level DRC/LVS/PEX closure for this placement and sizing only.
      Not full-chip or foundry signoff.  The LVS reference is a flat
      primitive-M schematic (11 M devices) because the PDK LVS schematic
      reader does not flatten X-inverter blocks; the hierarchical CDL with
      8 block instances is shipped alongside it.
