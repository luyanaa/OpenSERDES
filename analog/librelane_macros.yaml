# LibreLane macro fragment (abstract LEF, black-box Liberty, no timing arcs).
# Merge only after checking the target LibreLane MACROS schema and the actual
# macro instantiation.  The combined LEF avoids OpenROAD treating separate
# macro LEFs as the same abstract library.
MACROS:
  tx_inv_chain_1_3_9:
    gds:
      - analog/macros/tx_inv_chain_1_3_9/layout.gds
    lef:
      - analog/macros/sky130_analog_macros.lef
    nl:
      - analog/macros/tx_inv_chain_1_3_9/macro.v
    lib:
      "*":
        - analog/macros/tx_inv_chain_1_3_9/macro.lib
  rx_res_fb_inv:
    gds:
      - analog/macros/rx_res_fb_inv/layout.gds
    lef:
      - analog/macros/sky130_analog_macros.lef
    nl:
      - analog/macros/rx_res_fb_inv/macro.v
    lib:
      "*":
        - analog/macros/rx_res_fb_inv/macro.lib
