name: icsprout55
pdk_root: ${PDK_ROOT}
pdk: icsprout55-pdk
scl: ics55_LLSC_H7CR
default_corner: nom_tt_025C_1v20
scl_variants:
  ics55_LLSC_H7CH:
    vt: HVT
    native_dff: DFFRQX2H7H
    corners:
      nom_tt_025C_1v20:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CH/liberty/ics55_LLSC_H7CH_typ_tt_1p2_25_nldm.lib
      nom_ss_125C_1v08:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CH/liberty/ics55_LLSC_H7CH_ss_rcworst_1p08_125_nldm.lib
      nom_ff_n40C_1v32:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CH/liberty/ics55_LLSC_H7CH_ff_rcbest_1p32_m40_nldm.lib
  ics55_LLSC_H7CL:
    vt: LVT
    native_dff: DFFRQX2H7L
    corners:
      nom_tt_025C_1v20:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CL/liberty/ics55_LLSC_H7CL_typ_tt_1p2_25_nldm.lib
      nom_ss_125C_1v08:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CL/liberty/ics55_LLSC_H7CL_ss_rcworst_1p08_125_nldm.lib
      nom_ff_n40C_1v32:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CL/liberty/ics55_LLSC_H7CL_ff_rcbest_1p32_m40_nldm.lib
  ics55_LLSC_H7CR:
    vt: RVT
    native_dff: DFFRQX2H7R
    corners:
      nom_tt_025C_1v20:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CR/liberty/ics55_LLSC_H7CR_typ_tt_1p2_25_nldm.lib
      nom_ss_125C_1v08:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CR/liberty/ics55_LLSC_H7CR_ss_rcworst_1p08_125_nldm.lib
      nom_ff_n40C_1v32:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CR/liberty/ics55_LLSC_H7CR_ff_rcbest_1p32_m40_nldm.lib
track_height: 7
cell_height_um: 1.4
native_dff: DFFRQX2H7R   # default H7CR
limits:
  class: HS
  default_period_ns: 20.0
  serial_mbps: 50
  max_endpoint_line_rate_mbps: 200
  max_link_line_rate_mbps: 200
  max_sample_clock_mhz: 400   # 2.5 ns RX demonstrated at +0.315 ns (prepnr_sta.md 3.6)

  # Post-route bang-bang critical path 13.66 ns from STAPostPNR state.
  # Magic/KLayout/LVS were skipped for this PDK; the old 65 MHz scalar was
  # CP-implied and is not a physical signoff.
  clock_evidence_by_arch:
    bang_bang_oversampling:
      tested_max_mhz: 100          # 25 Mb/s x OS=4
      timing_closed_mhz: null
      physical_signoff_mhz: null   # cell DRC/LVS available; full PnR signoff pending
      cp_implied_mhz: 73           # 1000 / 13.66 ns, estimate only
      corner: nom_ss_125C_1v08
      tool: "LibreLane 3.0.17 / OpenSTA"
      commit: null
      source: build/pnr/cross_pdk.json + build/verify/ics55_drc_lvs.json
      note: "10 ns run: setup WNS -3.58 ns; a 3.0.14 re-run measured critical path 13.09 ns. KLayout DRC/LVS decks are now available; cell INVX1H7R DRC rc=0 with 23 recorded items and LVS PASS (make ics55-drc-lvs). A full-design re-run found and fixed a DEF layer-map mismatch (the PDK stream-in map has M1..M5 names, the DEF uses MET1..MET5); after the fix the GDS keeps routing and signal pins. Full-design main tiling DRC with default full-cell checks still does not finish (FEOL ACT_L_1 expands the CT layer by 12.5 um; 1-6 GB, >25 min). With cell_exclusion=true the same main tiling run completes in about a minute with 1117 items in 29 categories; the cross-PDK flow uses that mode. Full-design LVS now passes at the LVS layer without modifying vendor cells: the extra cell pins were KLayout hierarchical boundary pins from the flat substrate extent used by connect_global(PSUB/NW), not M2 pin access. The deck groups cell boundary pins by parent-net signature and joins them, re-creates unconnected reference pins from internal net labels, disconnects CDL _unconnected_* and layout dangling nets, flattens layout-only via cells, and (with -rd blackbox=true) compares the top-level interconnect with the vendor cells as pre-qualified black boxes. Evidence: serdes_rx_digital_nofill2_norsmp.gds vs merged_used2_nofill.cdl gives ICS55_LVS_COMPARE=PASS, ICS55_ERC=PASS, strict hierarchy 87/87 circuits; make ics55-drc-lvs still passes (LVS PASS, DRC rc=0, 23 items). Without black-boxing, 84/86 cell circuits match internally; INVX16H7R has the NMOS/PMOS drawn widths exchanged (layout NMOS 3.04 um vs CDL 2.4 um, +27%) and NAND3BBX0P5H7R places the C input at a different NMOS-stack point, so the full-chip run black-boxes the cells; the cell gate remains the cell-internal check. The earlier OBS/LEF trim experiments and RT_MIN_LAYER=MET3 remain rejected. Flow integration: the LVS step now passes top=DESIGN_NAME (the previous run selected a label-less top and reported 18268 ERC violations) and counts ICS55_ERC=FAIL as an LVS error. The filled final GDS now passes with flow_mode=true: fill/tap instances are removed in memory before extraction (keeping cell definitions so extraction indices are unchanged), top-cell cell-pin labels are filtered to the CDL boundary, and unused top pins stay open; evidence: 1238 fillers removed, ICS55_LVS_COMPARE=PASS, ICS55_ERC=PASS, strict hierarchy 87/87. The nofill GDS pair and the cell gate still pass. The earlier Circuit::join_nets abort was avoided because keeping the cell definitions preserves the extraction indices; blank+flatten and device-removal+flat compare remain rejected. Odb.ReportDisconnectedPins finds rx_smp disconnected (0 critical) but Checker.DisconnectedPins is skipped because the metric is missing. Not signoff-clean; no timing closure."
  note: "H7CL 5 ns TX + OS=2; RX can close at 2.5 ns. Endpoint/link gates are pre-PnR."
  note: "H7CH=HVT, H7CL=LVT, H7CR=RVT; all 7-track. PDK_ROOT is the Librelane overlay; PDK_LIB_ROOT is the icsprout55-pdk library root."
cts:
  target_skew_ps: 40
  max_slew_ns: 0.2
  max_cap_ff: 50
  max_fanout: 12
