name: icsprout55
pdk_root: ${PDK_ROOT}
pdk: icsprout55-pdk
scl: ics55_LLSC_H7CR
default_corner: nom_tt_025C_1v20
scl_variants:
  ics55_LLSC_H7CH:
    vt: HVT
    native_dff: DFFRQX2H7H
    corners:
      nom_tt_025C_1v20:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CH/liberty/ics55_LLSC_H7CH_typ_tt_1p2_25_nldm.lib
      nom_ss_125C_1v08:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CH/liberty/ics55_LLSC_H7CH_ss_rcworst_1p08_125_nldm.lib
      nom_ff_n40C_1v32:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CH/liberty/ics55_LLSC_H7CH_ff_rcbest_1p32_m40_nldm.lib
  ics55_LLSC_H7CL:
    vt: LVT
    native_dff: DFFRQX2H7L
    corners:
      nom_tt_025C_1v20:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CL/liberty/ics55_LLSC_H7CL_typ_tt_1p2_25_nldm.lib
      nom_ss_125C_1v08:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CL/liberty/ics55_LLSC_H7CL_ss_rcworst_1p08_125_nldm.lib
      nom_ff_n40C_1v32:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CL/liberty/ics55_LLSC_H7CL_ff_rcbest_1p32_m40_nldm.lib
  ics55_LLSC_H7CR:
    vt: RVT
    native_dff: DFFRQX2H7R
    corners:
      nom_tt_025C_1v20:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CR/liberty/ics55_LLSC_H7CR_typ_tt_1p2_25_nldm.lib
      nom_ss_125C_1v08:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CR/liberty/ics55_LLSC_H7CR_ss_rcworst_1p08_125_nldm.lib
      nom_ff_n40C_1v32:
        - ${PDK_LIB_ROOT}/libs.ref/ics55_LLSC_H7CR/liberty/ics55_LLSC_H7CR_ff_rcbest_1p32_m40_nldm.lib
track_height: 7
cell_height_um: 1.4
native_dff: DFFRQX2H7R   # default H7CR
limits:
  class: HS
  default_period_ns: 20.0
  serial_mbps: 50
  max_endpoint_line_rate_mbps: 200
  max_link_line_rate_mbps: 200
  max_sample_clock_mhz: 400   # 2.5 ns RX demonstrated at +0.315 ns (prepnr_sta.md 3.6)

  # Post-route bang-bang critical path 13.66 ns from STAPostPNR state.
  # Magic/KLayout/LVS were skipped for this PDK; the old 65 MHz scalar was
  # CP-implied and is not a physical signoff.
  clock_evidence_by_arch:
    bang_bang_oversampling:
      tested_max_mhz: 100          # 25 Mb/s x OS=4
      timing_closed_mhz: null
      physical_signoff_mhz: null   # cell DRC/LVS available; full PnR signoff pending
      cp_implied_mhz: 73           # 1000 / 13.66 ns, estimate only
      corner: nom_ss_125C_1v08
      tool: "LibreLane 3.0.17 / OpenSTA"
      commit: null
      source: build/pnr/cross_pdk.json + build/verify/ics55_drc_lvs.json
      note: "10 ns run: setup WNS -3.58 ns; a 3.0.14 re-run measured critical path 13.09 ns. KLayout DRC/LVS decks are now available; cell INVX1H7R LVS PASS and DRC 19 known library items (make ics55-drc-lvs). Full-design PnR signoff still pending; no timing closure."
  note: "H7CL 5 ns TX + OS=2; RX can close at 2.5 ns. Endpoint/link gates are pre-PnR."
  note: "H7CH=HVT, H7CL=LVT, H7CR=RVT; all 7-track. PDK_ROOT is the Librelane overlay; PDK_LIB_ROOT is the icsprout55-pdk library root."
cts:
  target_skew_ps: 40
  max_slew_ns: 0.2
  max_cap_ff: 50
  max_fanout: 12
