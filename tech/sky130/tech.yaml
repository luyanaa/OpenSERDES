name: sky130
pdk_root: ${PDK_ROOT}
pdk: sky130A
scl: sky130_fd_sc_hd
default_corner: nom_tt_025C_1v80
corners:
  nom_tt_025C_1v80:
    - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib
  nom_ss_100C_1v60:
    - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__ss_100C_1v60.lib
  nom_ff_n40C_1v95:
    - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__ff_n40C_1v95.lib
native_dff: sky130_fd_sc_hd__dfrtp_1
limits:
  class: MS
  default_period_ns: 40.0
  serial_mbps: 25
  # Conservative capability gates from the measured pre-PnR results in
  # docs/prepnr_sta.md.  Endpoint blocks are faster than the full OS=2 link.
  max_endpoint_line_rate_mbps: 100
  max_link_line_rate_mbps: 50
  max_sample_clock_mhz: 200   # 5 ns RX; 400 MHz is not realistic at 130 nm (prepnr_sta.md 3.5)
  note: "Endpoint 100 Mb/s, OS=2 full link 50 Mb/s; not post-route signoff."
# Integrated clock gate used by Yosys SYNTH_CLOCKGATE_* when the spec sets
# optimization.clock_gating: true.  Pins verified in the sky130 TT liberty:
# cell sky130_fd_sc_hd__dlclkp_1 has CLK / GATE / GCLK.
clock_gate:
  icg_cell: sky130_fd_sc_hd__dlclkp_1
  enable_pin: GATE
  clk_pin: CLK
  gated_clk_pin: GCLK
  min_width: 8
cts:
  target_skew_ps: 50
  max_slew_ns: 0.5
  max_cap_ff: 100
  max_fanout: 10
