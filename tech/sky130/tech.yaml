name: sky130
pdk_root: ${PDK_ROOT}
pdk: sky130A
scl: sky130_fd_sc_hd
# Additional same-process libraries.  hd and hdll are both 2.72 um (9-track)
# cells, so they tile the same rows and can be mixed cell-by-cell -- the ics55
# H7CL/H7CH/H7CR pattern, applied to sky130 leakage/speed classes.  Views are
# built by scripts/sky_install_family.py (json->Liberty conversion plus merged
# LEF/GDS/CDL), installed under libs.ref/<scl>, and carry their own SCL config.
scl_variants:
  sky130_fd_sc_hdll:
    vt: LVT
    native_dff: sky130_fd_sc_hdll__dfrtp_1
    track_height: 9
    cell_height_um: 2.72
    # hdll is the low-leakage family: same footprint and drive strength as hd
    # but slower and weaker.  Its liberty characterises no pin below 1.0 ns
    # max_transition, so hd's 0.5 ns design rule is unsatisfiable by
    # construction and repair_design spirals.  Use the family's own ceilings.
    cts:
      max_slew_ns: 1.0
      max_cap_ff: 200
      max_fanout: 10
      target_skew_ps: 50
    corners:
      nom_tt_025C_1v80:
        - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_fd_sc_hdll/lib/sky130_fd_sc_hdll__tt_025C_1v80.lib
      nom_ss_100C_1v60:
        - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_fd_sc_hdll/lib/sky130_fd_sc_hdll__ss_100C_1v60.lib
  # Leakage-first mix: hdll is the default family (all 324 cells) and hd
  # contributes only the 145 cells hdll does not have (ICG dlclkp, dfrtn,
  # tristate ebufn/einvn/einvp, lpflow, delay cells, probe, and the `_0`
  # drive variants).  There is no equal-footprint tie for ABC to break, so
  # every cell the flow picks is the low-leakage one; this is the ics55
  # "HVT default + other Vt where needed" pattern.
  sky130_ll9t:
    vt: mixed
    native_dff: sky130_fd_sc_hdll__dfrtp_1
    track_height: 9
    cell_height_um: 2.72
    cts:
      max_slew_ns: 1.0
      max_cap_ff: 200
      max_fanout: 10
      target_skew_ps: 50
    corners:
      nom_tt_025C_1v80:
        - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_ll9t/lib/sky130_ll9t__tt_025C_1v80.lib
      nom_ss_100C_1v60:
        - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_ll9t/lib/sky130_ll9t__ss_100C_1v60.lib
  # hd + hdll merged into one library (752 cells: 428 hd + 324 hdll) so the
  # synthesiser, resizer and CTS can pick per cell.  Mixed `hdll` cells are
  # lower-leakage equivalents for the same footprint and drive strength.
  sky130_mix9t:
    vt: mixed
    native_dff: sky130_fd_sc_hd__dfrtp_1
    track_height: 9
    cell_height_um: 2.72
    corners:
      nom_tt_025C_1v80:
        - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_mix9t/lib/sky130_mix9t__tt_025C_1v80.lib
      nom_ss_100C_1v60:
        - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_mix9t/lib/sky130_mix9t__ss_100C_1v60.lib
default_corner: nom_tt_025C_1v80
corners:
  nom_tt_025C_1v80:
    - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib
  nom_ss_100C_1v60:
    - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__ss_100C_1v60.lib
  nom_ff_n40C_1v95:
    - ${PDK_LIB_ROOT}/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__ff_n40C_1v95.lib
native_dff: sky130_fd_sc_hd__dfrtp_1
limits:
  class: MS
  default_period_ns: 40.0
  serial_mbps: 25
  # Conservative capability gates from the measured pre-PnR results in
  # docs/prepnr_sta.md.  Endpoint blocks are faster than the full OS=2 link.
  max_endpoint_line_rate_mbps: 100
  max_link_line_rate_mbps: 50
  max_sample_clock_mhz: 200   # 5 ns RX; 400 MHz is not realistic at 130 nm (prepnr_sta.md 3.5)

  # Post-route verified closure per CDR architecture (not the PDK bound).
  # bang_bang: 22 ns routed with exact-width NCO, see
  # docs/bang_bang_pipeline_study.md and build/pnr/cross_pdk_close22_A.json.
  # Sample-clock evidence for the CDR, by architecture.  A value belongs in
  # timing_closed_mhz only if a post-route run at that period has WNS >= 0;
  # physical_signoff_mhz additionally needs DRC/LVS clean.  cp_implied_mhz is
  # 1000/critical-path and is an estimate, never a closure.
  clock_evidence_by_arch:
    bang_bang_oversampling:
      tested_max_mhz: 100          # 25 Mb/s x OS=4; fails (-8.27 ns)
      timing_closed_mhz: 45.45     # 22 ns run: WNS 0 all corners
      physical_signoff_mhz: 45.45  # same run: Magic/KLayout DRC 0, LVS 0
      cp_implied_mhz: 53           # 1000 / 18.87 ns, estimate only
      corner: nom_ss_100C_1v60
      tool: "LibreLane 3.0.17 / OpenSTA"
      commit: null                 # record predates commit capture
      source: build/pnr/cross_pdk_close22_A.json
      note: "25 ns also closes at 40 MHz. max_fanout/max_cap CTS limits still
        report violations on the run and are not physical-signoff checks."
  note: "Endpoint 100 Mb/s, OS=2 full link 50 Mb/s; not post-route signoff."
# Integrated clock gate used by Yosys SYNTH_CLOCKGATE_* when the spec sets
# optimization.clock_gating: true.  Pins verified in the sky130 TT liberty:
# cell sky130_fd_sc_hd__dlclkp_1 has CLK / GATE / GCLK.
clock_gate:
  icg_cell: sky130_fd_sc_hd__dlclkp_1
  enable_pin: GATE
  clk_pin: CLK
  gated_clk_pin: GCLK
  min_width: 8
cts:
  target_skew_ps: 50
  max_slew_ns: 0.5
  max_cap_ff: 100
  max_fanout: 10
