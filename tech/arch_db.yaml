# Architecture candidates for the spec-driven generator.
#
# Metrics are RELATIVE and deliberately conservative.  They are placeholders
# for the Pareto search; replace them with measured post-route area/power from
# the qualification database as data becomes available.  confidence records
# whether a candidate has been measured in this repository.
tx:
  parallel_mux:
    module: serdes_tx_digital
    capture_mode: 0
    supports_link: true
    max_ratio_bits: 128
    max_line_rate_mbps: 200
    tech_overrides:
      sky130:       {max_line_rate_mbps: 50}
      gf180mcuD:    {max_line_rate_mbps: 25}
      ihp-sg13g2:   {max_line_rate_mbps: 50}
      icsprout55:   {max_line_rate_mbps: 100}
    metrics:
      area: 1.00
      power: 1.00
      latency: 1.00
    confidence: measured_pre_pnr
    note: "Single-cycle 256-bit input bank; highest load-enable fanout."
  word_group_capture:
    module: serdes_tx_digital
    capture_mode: 1
    supports_link: true
    max_ratio_bits: 4096
    max_line_rate_mbps: 200
    tech_overrides:
      sky130:       {max_line_rate_mbps: 100}
      gf180mcuD:    {max_line_rate_mbps: 50}
      ihp-sg13g2:   {max_line_rate_mbps: 100}
      icsprout55:   {max_line_rate_mbps: 200}
    metrics:
      area: 1.05
      power: 0.95
      latency: 1.25
    confidence: measured_pre_pnr
    note: "One word per cycle; external bus must stay stable for WORDS cycles."
  word_streaming:
    module: serdes_tx_stream_digital
    capture_mode: 0
    supports_link: false
    max_ratio_bits: 4096
    max_line_rate_mbps: 150
    tech_overrides:
      sky130:       {max_line_rate_mbps: 100}
      gf180mcuD:    {max_line_rate_mbps: 50}
      ihp-sg13g2:   {max_line_rate_mbps: 100}
      icsprout55:   {max_line_rate_mbps: 150}
    metrics:
      area: 0.80
      power: 0.85
      latency: 1.25
    confidence: estimated
    note: "Narrow valid/ready input; endpoint-only in this release."

rx:
  fixed_oversampling:
    module: serdes_rx_digital
    cdr_mode: 0
    min_oversample: 4
    max_line_rate_mbps: 200
    tech_overrides:
      sky130:       {max_line_rate_mbps: 50}
      gf180mcuD:    {max_line_rate_mbps: 25}
      ihp-sg13g2:   {max_line_rate_mbps: 50}
      icsprout55:   {max_line_rate_mbps: 200}
    metrics:
      area: 1.00
      power: 1.00
      latency: 1.00
    confidence: measured_pre_pnr
    note: "Fixed phase; requires frequency-locked/source-synchronous clocks."
  adaptive_oversampling:
    module: serdes_rx_digital
    cdr_mode: 1
    min_oversample: 8
    max_line_rate_mbps: 100
    tech_overrides:
      sky130:       {max_line_rate_mbps: 25}
      gf180mcuD:    {max_line_rate_mbps: 12.5}
      ihp-sg13g2:   {max_line_rate_mbps: 50}
      icsprout55:   {max_line_rate_mbps: 100}
    metrics:
      area: 1.25
      power: 1.20
      latency: 1.10
    confidence: rtl_validated
    note: "First-order frequency tracking; use OS>=8 for ppm margin."
  source_sync:
    module: serdes_rx_digital
    cdr_mode: 2
    min_oversample: 1
    max_line_rate_mbps: 200
    tech_overrides:
      sky130:       {max_line_rate_mbps: 100}
      gf180mcuD:    {max_line_rate_mbps: 50}
      ihp-sg13g2:   {max_line_rate_mbps: 100}
      icsprout55:   {max_line_rate_mbps: 200}
    metrics:
      area: 0.70
      power: 0.80
      latency: 0.75
    confidence: measured_pre_pnr
    note: "External forwarded bit clock; no CDR frequency acquisition."
