name: ihp-sg13g2
pdk_root: ${PDK_ROOT}
pdk: ihp-sg13g2
scl: sg13g2_stdcell
default_corner: nom_typ_1p20V_25C
scl_variants:
  # ETH Zurich 8-track library measured +2.1 ns faster than sg13g2_stdcell on
  # the serializer (docs/library_selection.md).  Liberty + LEF present in
  # /grid/ihp130/ez130_8t_v1p1; DFFRQX2 is the active-low-reset DFF (pin RB).
  ez130_8t_v1p1:
    vt: RVT
    native_dff: DFFRQX2
    track_height: 8
    cell_height_um: 3.36
    corners:
      nom_typ_1p20V_25C:
        - /grid/ihp130/ez130_8t_v1p1/lib/ez130_8t_tt_1p20v_25c.lib
      nom_slow_1p08V_125C:
        - /grid/ihp130/ez130_8t_v1p1/lib/ez130_8t_ss_1p08v_125c.lib
      nom_fast_1p32V_m40C:
        - /grid/ihp130/ez130_8t_v1p1/lib/ez130_8t_ff_1p32v_m40c.lib
corners:
  nom_typ_1p20V_25C:
    - ${PDK_LIB_ROOT}/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_typ_1p20V_25C.lib
  nom_slow_1p08V_125C:
    - ${PDK_LIB_ROOT}/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_slow_1p08V_125C.lib
  nom_fast_1p32V_m40C:
    - ${PDK_LIB_ROOT}/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib/sg13g2_stdcell_fast_1p32V_m40C.lib
track_height: 9
cell_height_um: 3.78
native_dff: sg13g2_dfrbpq_1
limits:
  note: "PDK_ROOT is the Librelane overlay if needed; PDK_LIB_ROOT is the IHP library root."
  class: MS
  default_period_ns: 20.0
  serial_mbps: 50
  max_endpoint_line_rate_mbps: 100
  max_link_line_rate_mbps: 50
  max_sample_clock_mhz: 200   # 5 ns RX closes at +1.78 ns (prepnr_sta.md 3.5)

  # Post-route STA bisection 2026-11-24 (LibreLane 3.0.14, full TT/SS/FF
  # corners).  Two boundaries were measured:
  #   * post-route only:  9.9 ns (101 MHz) is the last closing period
  #     (SS +0.016); 9.8/9.5/9.0/8.0 fail at SS (-0.08/-0.38/-0.67/-0.71).
  #   * full ladder:      pre-route SS fails below ~11.1 ns because the
  #     CDR phase->trans->freq_q cone needs the resizer+router to close.
  #     11.2 ns (89 MHz) is the first period where the *synthesized*
  #     netlist also closes at SS (+0.065), so collect_signoff reaches
  #     POST_ROUTE_TIMING.  11.0 ns pre-route SS is -0.135.
  # timing_closed_mhz is the full-ladder clean point (89 MHz); the 101 MHz
  # post-route-only headroom is kept in the note.  Physical signoff stays
  # null: KLayout LVS reports 1 residual mismatch (same open item as ez130).
  clock_evidence_by_arch:
    bang_bang_oversampling:
      tested_max_mhz: 89           # 22.32 Mb/s x OS=4
      timing_closed_mhz: 89        # POST_ROUTE_TIMING PASS: pre+post route SS close
      physical_signoff_mhz: null   # DRC clean (0/0 Magic+KLayout), LVS 1 residual
      cp_implied_mhz: 97           # 1000 / 10.30 ns post-route CP arrival @SS
      corner: nom_slow_1p08V_125C
      tool: "LibreLane 3.0.14 / OpenSTA"
      commit: 30eeeaf2a9ad404f65b25e305a52085492296dc1
      source: build/pnr/fmax_112ns.json
      observation_source: build/pnr/ihp_observe.json
      note: "11.2 ns run fmax112_ihp-sg13g2: pre-route WNS +0.065/+3.998/+6.420
        ns SS/TT/FF, post-route WNS +1.317/+4.870/+6.975 ns; hold +0.148
        post/+0.197 pre; 0 violations, max_slew/cap 0.  Full POST_ROUTE_TIMING
        ladder passes (collect_signoff).  Post-route-only headroom is 101 MHz
        (9.9 ns, SS +0.016) but pre-route SS is -1.236 there, so it does not
        satisfy the cumulative ladder.  Physical signoff blocked by 1 KLayout
        LVS residual mismatch.  Earlier: 10 ns run -0.74 ns SS (3.0.17)."
clock_gate:
  # sg13g2_stdcell ICG (clock_gating_integrated_cell).  Pins verified in the
  # typ/fast liberty: CLK in, GATE enable, GCLK gated clock.
  icg_cell: sg13g2_lgcp_1
  enable_pin: GATE
  clk_pin: CLK
  gated_clk_pin: GCLK
  min_width: 8
cts:
  target_skew_ps: 50
  max_slew_ns: 0.5
  max_cap_ff: 100
  max_fanout: 10
