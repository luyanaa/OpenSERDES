name: gf180mcuD
pdk_root: ${PDK_ROOT}
pdk: gf180mcuD
scl: gf180mcu_fd_sc_mcu7t5v0
default_corner: nom_tt_025C_5v00
scl_variants:
  # Foundry 9-track 5 V library.  Same three nom corners as the 7T default so
  # a routed A/B stays on the same voltage; the PDK already ships the
  # LibreLane config, tracks and SS/TT/FF liberty.
  gf180mcu_fd_sc_mcu9t5v0:
    native_dff: gf180mcu_fd_sc_mcu9t5v0__dffrnq_1
    track_height: 9
    cell_height_um: 5.04
    corners:
      nom_tt_025C_5v00:
        - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu9t5v0/lib/gf180mcu_fd_sc_mcu9t5v0__tt_025C_5v00.lib
      nom_ss_125C_4v50:
        - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu9t5v0/lib/gf180mcu_fd_sc_mcu9t5v0__ss_125C_4v50.lib
      nom_ff_n40C_5v50:
        - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu9t5v0/lib/gf180mcu_fd_sc_mcu9t5v0__ff_n40C_5v50.lib
  # Custom 3.3 V 7-track library under /grid/gf180mcu.  The ciel PDK does not
  # ship this ref; the flow expects a symlink at
  # $PDK_LIB_ROOT/gf180mcuD/libs.ref/gf180mcu_as_sc_mcu7t3v3.  No latch or ICG,
  # so synthesis has to clear those maps (see scripts/run_cross_pdk_pnr.py).
  gf180mcu_as_sc_mcu7t3v3:
    native_dff: gf180mcu_as_sc_mcu7t3v3__dfsrtp_2
    track_height: 7
    cell_height_um: 3.92
    corners:
      nom_tt_025C_3v30:
        - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_as_sc_mcu7t3v3/lib/gf180mcu_as_sc_mcu7t3v3__tt_025C_3v30.lib
      nom_ss_125C_3v00:
        - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_as_sc_mcu7t3v3/lib/gf180mcu_as_sc_mcu7t3v3__ss_125C_3v00.lib
      nom_ff_n40C_3v60:
        - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_as_sc_mcu7t3v3/lib/gf180mcu_as_sc_mcu7t3v3__ff_n40C_3v60.lib
  # OSU 9-track 3.3 V.  The ciel PDK ships the LibreLane config but not the
  # ref; libs.ref/gf180mcu_osu_sc_gp9t3v3 is a link farm over
  # /grid/gf180mcu/gf180mcu_osu_sc_gp9t3v3 with the liberty and techlef names
  # the config globs.  No ICG and no reset latch.  Cell LVS black-boxes
  # nfet_03v3/pfet_03v3, so a clean top-level LVS is not transistor proof.
  gf180mcu_osu_sc_gp9t3v3:
    native_dff: gf180mcu_osu_sc_gp9t3v3__dffsr_1
    track_height: 9
    cell_height_um: 6.30
    corners:
      nom_tt_025C_3v30:
        - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_osu_sc_gp9t3v3/lib/gf180mcu_osu_sc_gp9t3v3__tt_025C_3v30.lib
      nom_ss_125C_3v00:
        - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_osu_sc_gp9t3v3/lib/gf180mcu_osu_sc_gp9t3v3__ss_125C_3v00.lib
      nom_ff_n40C_3v60:
        - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_osu_sc_gp9t3v3/lib/gf180mcu_osu_sc_gp9t3v3__ff_n40C_3v60.lib
corners:
  nom_tt_025C_5v00:
    - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_5v00.lib
  nom_ss_125C_4v50:
    - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_4v50.lib
  nom_ff_n40C_5v50:
    - ${PDK_LIB_ROOT}/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_5v50.lib
track_height: 7
cell_height_um: 3.92
native_dff: gf180mcu_fd_sc_mcu7t5v0__dffrnq_1
limits:
  class: MS
  default_period_ns: 40.0
  serial_mbps: 25
  max_endpoint_line_rate_mbps: 50
  max_link_line_rate_mbps: 25
  max_sample_clock_mhz: 50    # 20 ns RX; 10 ns RX fails by 17 ns (prepnr_sta.md 3.7)

  # Post-route bang-bang critical path 29.2 ns at 20 ns target -> ~30 MHz.
  # No closing post-route period was found: the 20 ns run is DRC/LVS-clean but
  # fails setup by -8.18 ns.  The old 30 MHz scalar was CP-implied.
  clock_evidence_by_arch:
    bang_bang_oversampling:
      tested_max_mhz: 50           # 12.5 Mb/s x OS=4
      timing_closed_mhz: null
      physical_signoff_mhz: null   # DRC/LVS clean, timing not closed
      cp_implied_mhz: 34           # 1000 / 29.24 ns, estimate only
      corner: nom_ss_125C_4v50
      tool: "LibreLane 3.0.17 / OpenSTA"
      commit: null
      source: build/pnr/cross_pdk.json
      note: "20 ns run: setup WNS -8.18 ns. 10 ns also fails; no closing
        period was tried. A 3.0.14 observation measured CP 27.25 ns / WNS
        -6.53 ns, DRC/LVS 0; still no timing closure."
  note: "5 V mcu7t5v0; endpoint 50 Mb/s, full link 25 Mb/s with OS=2."
# Integrated clock gate used by Yosys SYNTH_CLOCKGATE_* when the spec sets
# optimization.clock_gating: true.  Pins verified in the gf180mcu tt liberty:
# cell <scl>__icgtp_1 has CLK (clock), E (enable) and Q (clock_gate_out_pin),
# i.e. the gated clock is the cell output, not a separately named GCLK pin.
# Note the polarity: icgtp_* is latch_posedge_precontrol (positive-edge,
# enable sampled before the clock edge); icgtn_* is the negative-edge variant.
clock_gate:
  icg_cell: gf180mcu_fd_sc_mcu7t5v0__icgtp_1
  enable_pin: E
  clk_pin: CLK
  gated_clk_pin: Q
  min_width: 8
cts:
  target_skew_ps: 50
  max_slew_ns: 0.5
  max_cap_ff: 100
  max_fanout: 10
